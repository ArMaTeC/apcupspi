# vsftpd configuration for the APC NMC emulation card.
# Dedicated nmcftp account only, chrooted to /var/lib/apc-nmc/ftp —
# system users and anonymous logins are refused.
listen=YES
listen_ipv6=NO
anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=022
dirmessage_enable=YES
use_localtime=YES
xferlog_enable=YES
connect_from_port_20=YES
chroot_local_user=YES
allow_writeable_chroot=YES
local_root=/var/lib/apc-nmc/ftp
userlist_enable=YES
userlist_deny=NO
userlist_file=/etc/vsftpd.userlist
check_shell=NO
pam_service_name=vsftpd
seccomp_sandbox=NO
pasv_enable=YES
pasv_min_port=40000
pasv_max_port=40100
# optional FTPS — set ssl_enable=YES once a cert exists:
# ssl_enable=YES
# rsa_cert_file=/etc/apc-nmc/nmc.pem
# rsa_private_key_file=/etc/apc-nmc/nmc.pem
# force_local_data_ssl=YES
# force_local_logins_ssl=YES
